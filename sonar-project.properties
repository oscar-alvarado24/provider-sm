# SonarQube project configuration file

# Unique key for the project (usually in reverse domain name style)
sonar.projectKey=com.example.provider-microservice

# Project's display name
sonar.projectName=Provider Microservice

# Project version
sonar.projectVersion=0.1.0

# Comma-separated paths to directories containing source code
sonar.sources=app

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Optionally, specify the language if not auto-detected (e.g., for Python)
# sonar.language=py

# Optionally, paths to test execution reports, coverage reports etc.
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.junit.reportPaths=reports/junit-report.xml
